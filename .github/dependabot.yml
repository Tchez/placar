version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    # typescript-eslint 8 supports TypeScript below 6.1 only.
    # Remove this ignore when its declared peer range includes TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions:
          - '>=7.0.0 <8.0.0'
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
